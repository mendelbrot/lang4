<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>lang4</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h2 {
      margin: 24px 0 10px 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      border-bottom: 1px solid #ffffff;
      padding-bottom: 4px;
    }
    h2:first-of-type {
      margin-top: 4px;
    }
    .category-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .word-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 76px;
      padding: 6px 4px;
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 6px;
      text-align: center;
      font: inherit;
      cursor: pointer;
      appearance: none;
    }
    .glyph {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glyph svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 4px;
    }
    .spelling {
      display: block;
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .gloss {
      display: block;
      margin-top: 2px;
      font-size: 0.72rem;
      color: #ffffff;
      line-height: 1.15;
      word-break: break-word;
    }
    .modal[hidden] {
      display: none;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 32px;
      text-align: center;
      overflow-y: auto;
    }
    .modal-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 6px;
      font-size: 1.75rem;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }
    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 520px;
      width: 100%;
    }
    .modal-glyph {
      width: min(220px, 55vw);
      height: min(220px, 55vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-glyph svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .modal-spelling {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .modal-short {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
    }
    .modal-definition {
      font-size: 1.05rem;
      color: #ffffff;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

  <div id="word-modal" class="modal" role="dialog" aria-modal="true" hidden>
    <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
    <div class="modal-content">
      <div id="modal-glyph" class="modal-glyph"></div>
      <div id="modal-spelling" class="modal-spelling"></div>
      <div id="modal-short" class="modal-short"></div>
      <div id="modal-definition" class="modal-definition"></div>
    </div>
  </div>
  <script>
    (() => {
      const modal = document.getElementById("word-modal");
      const closeBtn = document.getElementById("modal-close");
      const modalGlyph = document.getElementById("modal-glyph");
      const modalSpelling = document.getElementById("modal-spelling");
      const modalShort = document.getElementById("modal-short");
      const modalDefinition = document.getElementById("modal-definition");
      let lastTrigger = null;

      function openModal(card) {
        lastTrigger = card;
        const glyph = card.querySelector(".glyph");
        modalGlyph.innerHTML = glyph ? glyph.innerHTML : "";
        modalSpelling.textContent = card.dataset.spelling || "";
        modalShort.textContent = card.dataset.short || "";
        modalDefinition.textContent = card.dataset.definition || "";
        modal.hidden = false;
        document.body.style.overflow = "hidden";
        closeBtn.focus();
      }

      function closeModal() {
        modal.hidden = true;
        document.body.style.overflow = "";
        if (lastTrigger) {
          lastTrigger.focus();
          lastTrigger = null;
        }
      }

      document.addEventListener("click", (event) => {
        const card = event.target.closest(".word-card");
        if (card) {
          openModal(card);
        }
      });

      closeBtn.addEventListener("click", closeModal);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) {
          closeModal();
        }
      });
    })();
  </script>
