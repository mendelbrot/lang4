{% extends "page.html" %}
{% block page_class %}words-page{% endblock %}
{% block page_attrs %} data-jump="words"{% endblock %}
{% block content %}
  {% for cat in categories %}
  <h2 id="words-{{ cat.id }}" data-jump-group="{{ cat.type }}" data-jump-label="{{ cat.name }}">{{ cat.name }}</h2>
  <div class="category-row">
    {% for word in cat.words %}
    <button type="button" class="word-card"
      data-spelling="{{ word.spelling }}"
      data-short="{{ word.short }}"
      data-definition="{{ word.definition }}">
      <span class="glyph">{{ glyph(word.spelling) }}</span>
      <span class="spelling">{{ word.spelling }}</span>
      <span class="gloss">{{ word.short }}</span>
    </button>
    {% endfor %}
  </div>
  {% endfor %}
{% endblock %}
