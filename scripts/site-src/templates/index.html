<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zirkekpemim</title>
  <style>
{{ css | safe }}
  </style>
  <noscript>
    <style>
      .page[hidden] { display: block !important; }
    </style>
  </noscript>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <defs>
{% for sym in svg_symbols %}
      <symbol id="glyph-{{ sym.name }}" viewBox="{{ sym.viewbox }}">{{ sym.inner | safe }}</symbol>
{% endfor %}
    </defs>
  </svg>

{% for rendered_page in rendered_pages %}
{{ rendered_page | safe }}
{% endfor %}

  <button type="button" id="theme-toggle" class="nav-fab theme-fab" aria-label="toggle color theme"></button>
  <button type="button" id="section-nav-open" class="nav-fab" aria-label="open jump menu" hidden></button>

  <div id="glyph-popup" class="glyph-popup" role="tooltip" hidden>
    <span id="glyph-popup-spelling" class="glyph-popup-spelling"></span><br>
    <span id="glyph-popup-short" class="glyph-popup-short"></span>
  </div>

  <div id="word-modal" class="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-frame">
      <button type="button" id="modal-close" class="modal-close" aria-label="close">&times;</button>
      <div class="modal-content">
        <div id="modal-glyph" class="modal-glyph"></div>
        <div id="modal-spelling" class="modal-spelling"></div>
        <div id="modal-short" class="modal-short"></div>
        <div id="modal-definition" class="modal-definition"></div>
      </div>
    </div>
  </div>

  <div id="section-modal" class="modal section-modal" role="dialog" aria-modal="true" aria-label="jump menu" hidden>
    <div class="modal-frame section-modal-frame">
      <div class="modal-top-left">
        <button type="button" id="section-modal-home" class="modal-action-btn">home</button>
        <button type="button" id="section-modal-top" class="modal-action-btn">top</button>
      </div>
      <button type="button" id="section-modal-close" class="modal-close" aria-label="close">&times;</button>
      <div id="section-modal-content" class="section-modal-content"></div>
    </div>
  </div>

  <script>
{{ js | safe }}
  </script>
</body>
</html>
